<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <title>JSONBIN Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script type="text/javascript" src="static/qrcode.js"></script>
    <script>
        function generateQRCode(containerId, text, width = 150, height = 150) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            
            const qrcode = new QRCode(-1, QRErrorCorrectLevel.H);
            qrcode.addData(text);
            qrcode.make();
            
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            
            const tileW = width / qrcode.getModuleCount();
            const tileH = height / qrcode.getModuleCount();
            
            for (let row = 0; row < qrcode.getModuleCount(); row++) {
                for (let col = 0; col < qrcode.getModuleCount(); col++) {
                    ctx.fillStyle = qrcode.isDark(row, col) ? '#000000' : '#ffffff';
                    const w = Math.ceil((col + 1) * tileW) - Math.floor(col * tileW);
                    const h = Math.ceil((row + 1) * tileH) - Math.floor(row * tileH);
                    ctx.fillRect(Math.round(col * tileW), Math.round(row * tileH), w, h);
                }
            }
            container.appendChild(canvas);
        }
    </script>
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #5568d3;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .hidden { display: none !important; }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: var(--gray-500);
        }
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid var(--gray-200);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .panel {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header {
            margin-bottom: 20px;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 1.5rem; }
        .auth-section { max-width: 400px; margin: 40px auto; text-align: center; }

        .content-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 20px;
            height: calc(100vh - 180px);
        }
        @media (max-width: 968px) {
            .content-grid { grid-template-columns: 1fr; height: auto; }
        }

        .list-panel { display: flex; flex-direction: column; height: 100%; }
        .items-list {
            height: 300px;         /* Fixed height is required for scrolling */
            overflow-y: auto;      /* Adds scrollbar only when needed */
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            margin-top: 10px;
        }
        .item {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .item:hover { background: #f8f9fa; }
        .item:focus { outline: 2px solid var(--primary); outline-offset: -2px; }
        .item.active { background: #eff6ff; border-left: 4px solid var(--primary); }
        .item-header { display: flex; justify-content: space-between; align-items: center; }
        .item-name { font-weight: 500; font-size: 14px; word-break: break-all; }
        .item-meta {
            font-size: 11px;
            color: var(--gray-600);
            margin-top: 4px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .item-share-row {
            font-size: 10px;
            color: var(--gray-500);
            margin-top: 4px;
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .item-share-row .share-link-text {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            background: #f0fdf4;
            padding: 1px 6px;
            border-radius: 3px;
            border: 1px solid #bbf7d0;
            cursor: pointer;
            color: #166534;
        }
        .item-share-row .share-link-text:hover {
            background: #dcfce7;
        }
        .item-share-row .share-code-text {
            background: #fef3c7;
            padding: 1px 6px;
            border-radius: 3px;
            border: 1px solid #fde68a;
            color: #92400e;
            font-family: monospace;
        }

        .badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-json { background: #dbeafe; color: #1e40af; }
        .badge-md { background: #fce7f3; color: #9d174d; }
        .badge-img { background: #dcfce7; color: #166534; }
        .badge-audio { background: #fef3c7; color: #b45309; }
        .badge-video { background: #e0e7ff; color: #4338ca; }
        .badge-raw { background: var(--gray-100); color: var(--gray-700); }
        .badge-lock { background: #fef3c7; color: #92400e; }
        .badge-shared { background: #d1fae5; color: #065f46; }

        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--gray-700);
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--gray-200);
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        textarea.form-control {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            min-height: 400px;
            resize: vertical;
            line-height: 1.5;
        }
        .md-preview {
            border: 1px solid var(--gray-200);
            border-radius: 6px;
            padding: 20px;
            min-height: 400px;
            background: #fff;
            overflow-y: auto;
            line-height: 1.6;
        }
        .md-preview h1, .md-preview h2, .md-preview h3 { margin: 1em 0 0.5em; }
        .md-preview p { margin: 0.5em 0; }
        .md-preview ul, .md-preview ol { margin: 0.5em 0; padding-left: 1.5em; }
        .md-preview li { margin: 0.25em 0; }
        .md-preview blockquote {
            border-left: 4px solid var(--primary);
            margin: 1em 0;
            padding: 0.5em 1em;
            background: #f8f9fa;
            color: var(--gray-700);
        }
        .md-preview table {
            border-collapse: collapse;
            width: 100%;
            margin: 1em 0;
        }
        .md-preview th, .md-preview td {
            border: 1px solid var(--gray-200);
            padding: 8px 12px;
            text-align: left;
        }
        .md-preview th { background: var(--gray-100); font-weight: 600; }
        .md-preview tr:nth-child(even) { background: #f9f9f9; }
        .md-preview code { background: var(--gray-100); padding: 2px 6px; border-radius: 4px; }
        .md-preview pre { background: var(--gray-100); padding: 12px; border-radius: 6px; overflow-x: auto; position: relative; }
        .md-preview pre code { background: none; padding: 0; }
        .md-preview img { max-width: 100%; height: auto; }
        .md-preview a { color: var(--primary); }
        .md-preview hr { border: none; border-top: 1px solid var(--gray-200); margin: 1em 0; }
        .md-preview input[type="checkbox"] { margin-right: 8px; }

        .tree-view { font-size: 13px; }
        .tree-item { cursor: pointer; padding: 6px 8px; border-radius: 4px; transition: background 0.15s; }
        .tree-item:hover { background: #f0f0f0; }
        .tree-item.active { background: #eff6ff; border-left: 3px solid var(--primary); }
        .tree-item-row { display: flex; align-items: center; gap: 6px; }
        .tree-toggle { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; color: var(--gray-500); font-size: 10px; cursor: pointer; user-select: none; }
        .tree-toggle.expanded::after { content: '▼'; }
        .tree-toggle.collapsed::after { content: '▶'; }
        .tree-toggle.empty { visibility: hidden; }
        .tree-icon { width: 16px; text-align: center; }
        .tree-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tree-name.starred { color: var(--warning); font-weight: 500; }
        .tree-children { padding-left: 16px; }
        .tree-children.collapsed { display: none; }

        .star-btn { cursor: pointer; padding: 2px; font-size: 14px; opacity: 0.5; transition: opacity 0.2s, transform 0.2s; }
        .star-btn:hover { opacity: 1; transform: scale(1.2); }
        .star-btn.starred { opacity: 1; color: var(--warning); }

        .sort-bar { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
        .sort-btn { padding: 4px 8px; font-size: 11px; border: 1px solid var(--gray-200); border-radius: 4px; background: white; cursor: pointer; transition: all 0.2s; }
        .sort-btn:hover { background: var(--gray-100); }
        .sort-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .comment-panel { background: #fef9e7; border: 1px solid #fde68a; border-radius: 8px; padding: 12px; margin-top: 12px; }
        .comment-panel h4 { margin: 0 0 8px 0; font-size: 13px; color: #92400e; }
        .comment-textarea { width: 100%; min-height: 60px; padding: 8px; border: 1px solid #fde68a; border-radius: 4px; font-size: 12px; resize: vertical; }
        .comment-textarea:focus { outline: none; border-color: var(--primary); }

        .view-mode-bar { display: flex; gap: 4px; background: var(--gray-100); border-radius: 6px; padding: 2px; margin-bottom: 10px; }
        .view-mode-btn { padding: 6px 12px; font-size: 12px; border: none; background: transparent; border-radius: 4px; cursor: pointer; }
        .view-mode-btn.active { background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .code-copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .code-copy-btn:hover { opacity: 1; }
        .code-copy-btn.copied { background: var(--success); color: white; border-color: var(--success); }

        .editor-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .editor-actions .btn-success { order: 1; }
        .editor-actions .btn-outline { order: 2; }
        .editor-actions .btn-danger { order: 3; margin-left: auto; }
        .editor-actions .btn-secondary { order: 4; }
        .view-toggle { display: flex; gap: 2px; background: var(--gray-100); border-radius: 6px; padding: 2px; order: 5; }
        .view-toggle .btn { padding: 6px 12px; font-size: 12px; border: none; background: transparent; }
        .view-toggle .btn.active { background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .view-toggle .btn:not(.active) { color: var(--gray-600); }

        .audio-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            color: white;
        }
        .audio-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .audio-player { width: 100%; max-width: 500px; margin: 20px auto; }
        .audio-player audio { width: 100%; border-radius: 30px; }
        .audio-info { margin-top: 15px; font-size: 0.9rem; opacity: 0.9; }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
        }
        .editor-header h2 {
            font-size: 1rem;
            max-width: 60%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .type-select {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--gray-200);
            font-size: 12px;
            background: white;
            cursor: pointer;
        }
        .type-select:focus { outline: none; border-color: var(--primary); }

        .share-info-bar {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 12px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .share-info-bar .share-label {
            font-weight: 600;
            color: #166534;
        }
        .share-info-bar .share-url {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: monospace;
            font-size: 12px;
            color: #374151;
        }
        .share-info-bar .share-code-display {
            background: #fef3c7;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            color: #92400e;
            border: 1px solid #fde68a;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn:hover:not(:disabled) { transform: translateY(-1px); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover:not(:disabled) { background: #059669; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover:not(:disabled) { background: #dc2626; }
        .btn-secondary { background: var(--gray-500); color: white; }
        .btn-secondary:hover:not(:disabled) { background: var(--gray-600); }
        .btn-outline { background: white; border: 1px solid var(--gray-200); color: var(--gray-700); }
        .btn-outline:hover:not(:disabled) { background: var(--gray-100); }
        .btn-sm { padding: 4px 10px; font-size: 12px; }

        .editor-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #eee;
            padding-top: 20px;
            flex-wrap: wrap;
        }

        .tabs { display: flex; gap: 2px; margin-bottom: -1px; }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border: 1px solid transparent;
            border-radius: 6px 6px 0 0;
            background: var(--gray-100);
            color: var(--gray-600);
            font-size: 14px;
            transition: all 0.2s;
        }
        .tab:hover { background: var(--gray-200); }
        .tab.active {
            background: white;
            border-color: var(--gray-200);
            color: var(--primary);
            border-bottom: 1px solid white;
            font-weight: 600;
        }

        .stats { display: flex; gap: 10px; margin-bottom: 10px; }
        .stat-card {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            flex: 1;
            text-align: center;
        }
        .stat-val { font-size: 1.25rem; font-weight: bold; color: var(--primary); }
        .stat-lbl { font-size: 0.7rem; color: var(--gray-600); text-transform: uppercase; letter-spacing: 0.5px; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal {
            background: white;
            padding: 24px;
            border-radius: 12px;
            width: 420px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } }
        .modal h3 { margin-bottom: 20px; color: var(--gray-700); }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .alert-success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .alert-warning { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray-500);
        }
        .empty-state-icon { font-size: 3rem; margin-bottom: 10px; }

        kbd {
            background: var(--gray-100);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            border: 1px solid var(--gray-200);
            font-family: monospace;
        }

        [data-tooltip] { position: relative; }
        [data-tooltip]:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--gray-700);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗄️ JSONBIN Admin</h1>
            <button id="logoutBtn" class="btn btn-outline hidden" onclick="app.logout()">Logout</button>
        </div>

        <div id="authSection" class="panel auth-section">
            <h2 style="margin-bottom: 20px;">Authentication</h2>
            <form onsubmit="event.preventDefault(); app.login();">
                <div class="form-group">
                    <input type="password" id="apiKeyInput" class="form-control" placeholder="Enter API Key" autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Connect</button>
            </form>
        </div>

        <div id="mainContent" class="hidden">
            <div class="content-grid">
                <div class="panel list-panel">
                    <div class="stats">
                        <div class="stat-card">
                            <div class="stat-val" id="stTotal">0</div>
                            <div class="stat-lbl">Items</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-val" id="stJson">0</div>
                            <div class="stat-lbl">JSON</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-val" id="stEnc">0</div>
                            <div class="stat-lbl">Locked</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-val" id="stShared">0</div>
                            <div class="stat-lbl">Shared</div>
                        </div>
                    </div>
                    <div style="display:flex; gap:8px; margin-bottom:10px">
                        <button class="btn btn-primary" style="flex:1" onclick="app.newItem()" data-tooltip="Create new item">+ New</button>
                        <button class="btn btn-secondary" style="flex:1" onclick="app.loadItems()" data-tooltip="Refresh list">↻ Refresh</button>
                    </div>
                    <div style="display:flex; gap:8px; margin-bottom:10px; flex-wrap: wrap;">
                        <div class="view-mode-bar" style="flex:1; min-width: 120px;">
                            <button class="view-mode-btn active" data-mode="list" onclick="app.setListView('list')" title="List View">☰ List</button>
                            <button class="view-mode-btn" data-mode="tree" onclick="app.setListView('tree')" title="Tree View">🗂 Tree</button>
                        </div>
                        <div class="sort-bar" style="flex:1; min-width: 200px; justify-content: flex-end;">
                            <button class="sort-btn" onclick="app.setSort('name')" data-sort="name">Name</button>
                            <button class="sort-btn" onclick="app.setSort('size')" data-sort="size">Size</button>
                            <button class="sort-btn" onclick="app.setSort('type')" data-sort="type">Type</button>
                            <button class="sort-btn" onclick="app.setSort('starred')" data-sort="starred">★</button>
                        </div>
                    </div>
                    <input type="text" id="searchBox" class="form-control" placeholder="🔍 Search items..." oninput="app.handleSearch()">
                    <div id="itemsList" class="items-list"></div>
                </div>

                <div class="panel" style="display: flex; flex-direction: column;">
                    <div id="editorHeader" class="editor-header hidden">
                        <h2 id="editorTitle" title="">Select Item</h2>
                        <select id="typeSelector" class="type-select" onchange="app.changeType(this.value)">
                            <option value="application/json">JSON</option>
                            <option value="text/plain">Text</option>
                            <option value="text/markdown">Markdown</option>
                            <option value="image/png">Image (PNG)</option>
                            <option value="image/jpeg">Image (JPEG)</option>
                            <option value="image/gif">Image (GIF)</option>
                            <option value="image/webp">Image (WebP)</option>
                            <option value="audio/mpeg">Audio (MP3)</option>
                            <option value="audio/wav">Audio (WAV)</option>
                            <option value="audio/ogg">Audio (OGG)</option>
                            <option value="video/mp4">Video (MP4)</option>
                            <option value="video/webm">Video (WebM)</option>
                            <option value="application/pdf">PDF</option>
                            <option value="application/octet-stream">Binary</option>
                        </select>
                    </div>
                    <div id="shareInfoBar"></div>
                    <div id="alertArea"></div>
                    <div id="commentPanel"></div>
                    <div id="editorContainer" style="flex: 1; display: flex; flex-direction: column;">
                        <div class="empty-state">
                            <div class="empty-state-icon">📄</div>
                            <p>Select an item to view or edit</p>
                            <p style="margin-top: 10px; font-size: 0.8rem;">or click <strong>+ New</strong> to create one</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Share Modal -->
    <div id="shareModal" class="hidden modal-overlay" onclick="app.closeModalOnBackdrop(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <h3>🔗 Share Public Link</h3>

                    <label>Current Code</label>
                    <input type="text" id="existingShareCode" class="form-control" readonly style="font-family: monospace;">

                <hr style="margin: 15px 0; border: none; border-top: 1px solid #eee;">
                <p style="font-size: 13px; color: var(--gray-600);">Generate a new link below to replace the current one:</p>
            </div>
            <div class="form-group">
                <label>Expires In</label>
                <select id="shareExpiry" class="form-control">
                    <option value="0">Disabled</option>
                    <option value="1">Never (Forever)</option>
                    <option value="3600">1 Hour</option>
                    <option value="86400">1 Day</option>

                </select>

            <div class="form-group">
                <label>Share Code (Optional password)</label>
                <input type="text" class="form-control" id="sharedCode" placeholder="Leave empty for no password">

            <div class="form-group hidden" id="shareResultGroup">
                <label>New Share URL</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="shareUrl" class="form-control" readonly style="flex: 1;">
                    <button class="btn btn-secondary" onclick="app.copyShareUrl()" data-tooltip="Copy to clipboard">📋</button>

    <!-- Rename Modal -->
    <div id="renameModal" class="hidden modal-overlay" onclick="app.closeModalOnBackdrop(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <h3>✏️ Rename Item</h3>
            <div class="form-group">
                <label>Path</label>
                <input type="text" id="renamePath" class="form-control" placeholder="/path/to/file">
            </div>
            <div class="form-group">
                <label>Filename</label>
                <input type="text" id="renameFilename" class="form-control" placeholder="filename.ext">
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="app.closeRenameModal()">Cancel</button>
                <button class="btn btn-primary" onclick="app.submitRename()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        const utils = {
            escapeHtml(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            },

            // Markdown can contain raw HTML/script; marked doesn't sanitize
            // it, so always run the output through DOMPurify before it is
            // ever assigned to innerHTML.
            renderMarkdown(source) {
                if (typeof marked === 'undefined') return utils.escapeHtml(source);
                marked.setOptions({ gfm: true, breaks: true });
                const html = marked.parse(source || '');
                return typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(html) : utils.escapeHtml(source);
            },

            debounce(fn, delay) {
                let timer;
                return (...args) => {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn(...args), delay);
                };
            },

            formatSize(bytes) {
                if (!bytes || bytes === '?') return '?';
                const num = parseInt(bytes, 10);
                if (isNaN(num)) return bytes;
                if (num < 1024) return num + ' B';
                if (num < 1024 * 1024) return (num / 1024).toFixed(1) + ' KB';
                return (num / (1024 * 1024)).toFixed(1) + ' MB';
            },

            formatDuration(seconds) {
                if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return mins + ':' + secs.toString().padStart(2, '0');
            },

            getAudioIcon(type) {
                if (type.includes('wav')) return '🎵';
                if (type.includes('ogg')) return '🎶';
                return '🎧';
            },

            formatExpiry(expiresSec, shareActivateStamp) {
                if (expiresSec === 0 || expiresSec === '0') return 'Disabled';
                if (expiresSec === 1 || expiresSec === '1') return 'Forever';
                if (!shareActivateStamp) return expiresSec + 's';
                const elapsed = (Date.now() - shareActivateStamp) / 1000;
                const remaining = expiresSec - elapsed;
                if (remaining <= 0) return 'Expired';
                if (remaining < 60) return Math.ceil(remaining) + 's left';
                if (remaining < 3600) return Math.ceil(remaining / 60) + 'm left';
                if (remaining < 86400) return Math.ceil(remaining / 3600) + 'h left';
                return Math.ceil(remaining / 86400) + 'd left';
            }
        };

        const app = {
            key: '',
            items: [],
            current: null,
            currentObjectUrl: null,
            viewMode: 'list',
            sortBy: 'name',
            sortAsc: true,
            expandedFolders: {},
            starredItems: JSON.parse(localStorage.getItem('starredItems') || '[]'),
            comments: JSON.parse(localStorage.getItem('itemComments') || '{}'),

            revokeObjectUrl() {
                if (this.currentObjectUrl) {
                    URL.revokeObjectURL(this.currentObjectUrl);
                    this.currentObjectUrl = null;
                }
            },

            setActiveItem(name) {
                document.querySelectorAll('.tree-item, .item').forEach(el => {
                    el.classList.toggle('active', decodeURIComponent(el.dataset.name) === name);
                });
            },

            toggleStar(name) {
                const idx = this.starredItems.indexOf(name);
                if (idx > -1) {
                    this.starredItems.splice(idx, 1);
                } else {
                    this.starredItems.push(name);
                }
                localStorage.setItem('starredItems', JSON.stringify(this.starredItems));
                this.renderList();
            },

            isStarred(name) {
                return this.starredItems.includes(name) || this.starredItems.includes(decodeURIComponent(name));
            },

            toggleStarEncoded(encodedName) {
                const name = decodeURIComponent(encodedName);
                this.toggleStar(name);
            },

            saveComment(name, comment) {
                if (comment.trim()) {
                    this.comments[name] = comment;
                } else {
                    delete this.comments[name];
                }
                localStorage.setItem('itemComments', JSON.stringify(this.comments));
            },

            getComment(name) {
                return this.comments[name] || '';
            },

            // ================== AUTH ==================
            login() {
                const key = document.getElementById('apiKeyInput').value.trim();
                if (!key) {
                    this.showAlert('API key is required', 'error');
                    return;
                }
                this.key = key;
                localStorage.setItem('jsonbin_key', key);

                this.loadItems().then(ok => {
                    if (ok) {
                        document.getElementById('authSection').classList.add('hidden');
                        document.getElementById('mainContent').classList.remove('hidden');
                        document.getElementById('logoutBtn').classList.remove('hidden');
                    }
                });
            },

            logout() {
                this.key = '';
                this.items = [];
                this.current = null;
                this.revokeObjectUrl();
                localStorage.removeItem('jsonbin_key');
                document.getElementById('authSection').classList.remove('hidden');
                document.getElementById('mainContent').classList.add('hidden');
                document.getElementById('logoutBtn').classList.add('hidden');
                document.getElementById('apiKeyInput').value = '';
            },

            // ================== LIST ==================
            async loadItems() {
                try {
                    document.getElementById('itemsList').innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';

                    const res = await fetch(`/_q/?list&json_response=1&key=${encodeURIComponent(this.key)}`);
                    if (!res.ok) {
                        const errText = await res.text();
                        throw new Error(res.status === 401 ? 'Invalid API key' : errText);
                    }

                    const json = await res.json();

                    this.items = json.map(item => ({
                        name: item.name || '',
                        filename: item.filename || '-',
                        type: item.filetype || 'application/octet-stream',
                        enc: item.encrypted === 'yes',
                        size: item.size || '?',
                        shareLink: item.shareLink || '',
                        code: item.code || '',
                        expiresSec: item.expiresSec ?? '',
                        shareActivateStamp: item.shareActivateStamp || '',
                        note: item.note || ''
                    }));

                    this.renderList();
                    this.updateStats();
                    return true;
                } catch (e) {
                    this.showAlert(e.message, 'error');
                    document.getElementById('itemsList').innerHTML = '<div class="empty-state"><p>Failed to load items</p></div>';
                    return false;
                }
            },

            handleSearch: utils.debounce(function() {
                app.renderList();
            }, 200),

            setListView(mode) {
                this.viewMode = mode;
                document.querySelectorAll('.view-mode-btn').forEach(btn => {
                    const btnMode = btn.getAttribute('data-mode');
                    btn.classList.toggle('active', btnMode === mode);
                });
                this.renderList();
            },

            setSort(by) {
                if (this.sortBy === by) {
                    this.sortAsc = !this.sortAsc;
                } else {
                    this.sortBy = by;
                    this.sortAsc = true;
                }
                document.querySelectorAll('.sort-btn').forEach(btn => {
                    const isActive = btn.dataset.sort === this.sortBy;
                    btn.classList.toggle('active', isActive);
                    if (isActive) btn.textContent = this.sortBy === 'starred' ? '★' + (this.sortAsc ? '↑' : '↓') : btn.dataset.sort + (this.sortAsc ? '↑' : '↓');
                    else btn.textContent = btn.dataset.sort === 'starred' ? '★' : btn.dataset.sort.charAt(0).toUpperCase() + btn.dataset.sort.slice(1);
                });
                this.renderList();
            },

            getSortedItems(items) {
                const starred = this.starredItems;
                return [...items].sort((a, b) => {
                    if (this.sortBy === 'starred') {
                        const aStar = starred.includes(a.name) ? 1 : 0;
                        const bStar = starred.includes(b.name) ? 1 : 0;
                        return this.sortAsc ? bStar - aStar : aStar - bStar;
                    }
                    if (this.sortBy === 'size') {
                        return this.sortAsc ? (parseInt(a.size) || 0) - (parseInt(b.size) || 0) : (parseInt(b.size) || 0) - (parseInt(a.size) || 0);
                    }
                    if (this.sortBy === 'type') {
                        return this.sortAsc ? a.type.localeCompare(b.type) : b.type.localeCompare(a.type);
                    }
                    return this.sortAsc ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name);
                });
            },

            renderList() {
                const query = (document.getElementById('searchBox').value || '').toLowerCase();
                let filtered = this.items.filter(i =>
                    i.name.toLowerCase().includes(query) ||
                    i.filename.toLowerCase().includes(query)
                );

                if (filtered.length === 0) {
                    document.getElementById('itemsList').innerHTML = `
                        <div class="empty-state" style="padding: 40px;">
                            <p>${this.items.length === 0 ? 'No items yet' : 'No matches found'}</p>
                        </div>`;
                    return;
                }

                filtered = this.getSortedItems(filtered);

                if (this.viewMode === 'tree') {
                    this.renderTreeView(filtered);
                } else {
                    this.renderFlatList(filtered);
                }
            },

            renderFlatList(items) {
                document.getElementById('itemsList').innerHTML = items.map((item) => {
                    const isActive = this.current && this.current.name === item.name;
                    const badgeType = this.getBadgeType(item.type);
                    const escapedName = utils.escapeHtml(item.name);
                    const escapedFilename = utils.escapeHtml(item.filename);
                    const hasShare = item.shareLink && item.shareLink !== '-';
                    const hasCode = item.code && item.code !== '-';
                    const isStarred = this.isStarred(item.name);

                    let shareRow = '';
                    if (hasShare) {
                        const fullShareUrl = window.location.origin + item.shareLink;
                        const expiryLabel = utils.formatExpiry(item.expiresSec, item.shareActivateStamp);
                        shareRow = `
                            <div class="item-share-row">
                                <span class="share-link-text" title="${utils.escapeHtml(fullShareUrl)}" onclick="event.stopPropagation(); app.copyText('${utils.escapeHtml(fullShareUrl)}')">
                                    🔗 ${utils.escapeHtml(fullShareUrl.length > 40 ? fullShareUrl.slice(0, 37) + '...' : fullShareUrl)}
                                </span>
                                ${hasCode ? '<span class="share-code-text" title="Share code">🔑 ' + utils.escapeHtml(item.code) + '</span>' : ''}
                                <span style="color: #6b7280; font-size: 10px;">⏱ ${expiryLabel}</span>
                            </div>`;
                    }

                    return `
                        <div class="item ${isActive ? 'active' : ''}"
                             tabindex="0"
                             data-name="${encodeURIComponent(item.name)}">
                            <div class="item-header">
                                <span class="item-name ${isStarred ? 'starred' : ''}" title="${escapedName}">${isStarred ? '★ ' : ''}${escapedName}</span>
                                <span style="display: flex; gap: 4px; align-items: center;">
                                    <span class="star-btn ${isStarred ? 'starred' : ''}" onclick="event.stopPropagation(); app.toggleStarEncoded('${encodeURIComponent(item.name)}')">${isStarred ? '★' : '☆'}</span>
                                    ${hasShare ? '<span class="badge badge-shared">🔗</span>' : ''}
                                    ${item.enc ? '<span class="badge badge-lock">🔒</span>' : ''}
                                </span>
                            </div>
                            <div class="item-meta">
                                <span class="badge badge-${badgeType}">${badgeType.toUpperCase()}</span>
                                <span title="${escapedFilename}">${escapedFilename.length > 15 ? escapedFilename.slice(0,12) + '...' : escapedFilename}</span>
                                <span>${utils.formatSize(item.size)}</span>
                            </div>
                            ${shareRow}
                        </div>`;
                }).join('');
            },

            renderTreeView(items) {
                const tree = this.buildTree(items);
                document.getElementById('itemsList').innerHTML = this.renderTreeNode(tree, '', true);
            },

            buildTree(items) {
                const root = { children: {}, isDir: true, name: '' };
                items.forEach(item => {
                    const parts = item.name.split('/').filter(p => p);
                    let node = root;
                    parts.forEach((part, idx) => {
                        if (!node.children[part]) {
                            node.children[part] = { children: {}, isDir: idx < parts.length - 1, name: part, fullPath: parts.slice(0, idx + 1).join('/'), item: idx === parts.length - 1 ? item : null };
                        }
                        node = node.children[part];
                    });
                });
                return root;
            },

            renderTreeNode(node, parentPath = '', isRoot = false) {
                const children = Object.keys(node.children).sort();
                if (children.length === 0 && !isRoot) return '';

                return children.map(key => {
                    const child = node.children[key];
                    const fullPath = parentPath ? `${parentPath}/${key}` : `/${key}`;
                    const isExpanded = this.expandedFolders[fullPath];
                    const isActive = this.current && this.current.name === fullPath;
                    const hasChildren = Object.keys(child.children).length > 0;
                    const isStarred = child.item && this.isStarred(fullPath);
                    const badgeType = child.item ? this.getBadgeType(child.item.type) : 'raw';

                    let html = '';
                    if (!isRoot) {
                        html = `
                            <div class="tree-item ${isActive ? 'active' : ''}" data-name="${encodeURIComponent(fullPath)}">
                                <div class="tree-item-row">
                                    <span class="tree-toggle ${hasChildren ? (isExpanded ? 'expanded' : 'collapsed') : 'empty'}" onclick="event.stopPropagation(); app.toggleFolder('${fullPath}')"></span>
                                    <span class="tree-icon">${child.isDir ? '📁' : this.getFileIcon(child.item?.type)}</span>
                                    <span class="tree-name ${isStarred ? 'starred' : ''}" onclick="app.openByName('${encodeURIComponent(fullPath)}')">${isStarred ? '★ ' : ''}${utils.escapeHtml(key)}</span>
                                    <span class="star-btn ${isStarred ? 'starred' : ''}" onclick="event.stopPropagation(); app.toggleStarEncoded('${encodeURIComponent(fullPath)}')">${isStarred ? '★' : '☆'}</span>
                                    ${child.item ? `<span class="badge badge-${badgeType}" style="font-size: 9px;">${badgeType.toUpperCase()}</span>` : ''}
                                </div>
                            </div>`;
                    }

                    if (hasChildren) {
                        html += `<div class="tree-children ${isExpanded ? '' : 'collapsed'}" id="tree-${fullPath.replace(/\//g, '_')}">`;
                        html += this.renderTreeNode(child, fullPath);
                        html += '</div>';
                    }
                    return html;
                }).join('');
            },

            toggleFolder(path) {
                this.expandedFolders[path] = !this.expandedFolders[path];
                this.renderList();
            },

            getFileIcon(type) {
                if (!type) return '📄';
                if (type.includes('json')) return '📋';
                if (type.includes('markdown')) return '📝';
                if (type.includes('text')) return '📄';
                if (type.startsWith('image/')) return '🖼️';
                if (type.startsWith('audio/')) return '🎵';
                if (type.startsWith('video/')) return '🎬';
                if (type.includes('pdf')) return '📕';
                if (type.includes('xml')) return '📰';
                return '📎';
            },

            getBadgeType(type) {
                if (!type) return 'raw';
                if (type.includes('json')) return 'json';
                if (type.includes('markdown')) return 'md';
                if (type.startsWith('image/')) return 'img';
                if (type.startsWith('audio/')) return 'audio';
                if (type.startsWith('video/')) return 'video';
                return 'raw';
            },

            updateStats() {
                document.getElementById('stTotal').innerText = this.items.length;
                document.getElementById('stJson').innerText = this.items.filter(i => i.type.includes('json')).length;
                document.getElementById('stEnc').innerText = this.items.filter(i => i.enc).length;
                document.getElementById('stShared').innerText = this.items.filter(i => i.shareLink && i.shareLink !== '-' && i.shareLink !== '').length;
            },

            // ================== COPY HELPER ==================
            copyText(text) {
                

                navigator.clipboard.writeText(text).then(() => {
                    this.showAlert('Copied to clipboard!', 'success');
                }).catch(() => {
                    // Fallback
                    const input = document.createElement('input');
                    input.value = text;
                    document.body.appendChild(input);
                    input.select();
                    document.execCommand('copy');
                    document.body.removeChild(input);
                    this.showAlert('Copied to clipboard!', 'success');
                });
            },

            // ================== OPEN/VIEW ==================
            openByName(encodedName) {
                const name = decodeURIComponent(encodedName);
                const item = this.items.find(i => i.name === name);
                if (item) {
                    this.open(item);
                } else {
                    this.showAlert('Item not found: ' + name, 'error');
                }
            },

            async open(item, decryptKey = null) {
                if (!item || !item.name) return;

                this.current = { ...item, decryptKey };
                if (!this.viewMode) this.viewMode = 'view';
                this.setActiveItem(item.name);
                this.revokeObjectUrl();

                document.getElementById('editorHeader').classList.remove('hidden');
                document.getElementById('typeSelector').parentElement.classList.remove('hidden');

                const titleEl = document.getElementById('editorTitle');
                titleEl.innerText = item.name;
                titleEl.title = item.name;

                // Render share info bar
                this.renderShareInfoBar(item);
                await this.renderCommentPanel(item.name);

                document.getElementById('editorContainer').innerHTML = '<div class="loading"><div class="spinner"></div>Loading content...</div>';

                let url = `${item.name}?key=${encodeURIComponent(this.key)}&s=raw`;
                if (decryptKey) {
                    url += `&c=${encodeURIComponent(decryptKey)}`;
                }

                try {
                    const res = await fetch(url);

                    if (res.status === 403) {
                        this.renderDecryptForm();
                        return;
                    }

                    if (!res.ok) {
                        let errMsg = `HTTP ${res.status}`;
                        try { errMsg = await res.text(); } catch (e) {}
                        throw new Error(errMsg);
                    }

                    const contentType = res.headers.get('content-type') || 'application/octet-stream';
                    this.setSelectorValue(contentType);
                    this._currentContentType = contentType;

                    const isEditable = contentType.includes('json') || contentType.includes('markdown') || contentType.startsWith('text/') || contentType.includes('xml');

                    if (!isEditable) {
                        try {
                            const blob = await res.blob();
                            this.currentObjectUrl = URL.createObjectURL(blob);
                            this.renderFileViewer(this.currentObjectUrl, contentType);
                        } catch (blobErr) {
                            this.renderBinaryViewer(contentType);
                        }
                    } else if (contentType.includes('json')) {
                        const txt = await res.text();
                        try {
                            const json = JSON.parse(txt);
                            this.renderJsonEditor(JSON.stringify(json, null, 2));
                        } catch (e) {
                            this.renderTextEditor(txt, false);
                        }
                    } else {
                        const txt = await res.text();
                        this.renderTextEditor(txt, contentType.includes('markdown'));
                    }
                } catch (e) {
                    document.getElementById('editorContainer').innerHTML = `
                        <div class="alert alert-error">Error: ${utils.escapeHtml(e.message)}</div>`;
                }
            },

            renderShareInfoBar(item) {
                const bar = document.getElementById('shareInfoBar');
                const hasShare = item.shareLink && item.shareLink !== '-' && item.shareLink !== '';
                const hasCode = item.code && item.code !== '-' && item.code !== '';

                if (!hasShare) {
                    bar.innerHTML = '';
                    return;
                }

                const fullShareUrl = window.location.origin + item.shareLink;
                const expiryLabel = utils.formatExpiry(item.expiresSec, item.shareActivateStamp);
                let shareUrl = `${fullShareUrl.slice(0, Math.min(60,fullShareUrl.length))}...`;

                let url = utils.escapeHtml(fullShareUrl);
               
                bar.innerHTML = `
                    <div class="share-info-bar">
                        <span class="share-label">🔗 Shared</span>
                        <span class="share-url" title="${url}">${utils.escapeHtml(shareUrl)}</span>
                        ${hasCode ? '<span class="share-code-display">🔑 ' + utils.escapeHtml(item.code) + '</span>' : ''}
                        <span style="font-size: 12px; color: var(--gray-500);">⏱ ${expiryLabel}</span>
                        <button class="btn btn-sm btn-outline" onclick="generateQRCode('qrcode', '${fullShareUrl}');const overlay = document.getElementById('imageOverlay'); if(overlay){ overlay.style.display = 'flex'; }; app.copyText('${url}');" data-tooltip="Copy link">📋</button>
                        <div id="imageOverlay" onclick="this.style.display='none'"  style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
                            <div id="qrcode"></div>
                        </div>


                    </div>`;
            },

            setSelectorValue(type) {
                const sel = document.getElementById('typeSelector');
                const exists = [...sel.options].some(o => o.value === type);
                if (!exists) {
                    const opt = document.createElement('option');
                    opt.value = type;
                    opt.text = type;
                    sel.add(opt);
                }
                sel.value = type;
            },

            renderDecryptForm() {
                document.getElementById('editorContainer').innerHTML = `
                    <div style="max-width: 350px; margin: 40px auto;">
                        <div class="alert alert-warning">🔒 This file is encrypted</div>
                        <form onsubmit="event.preventDefault(); app.submitDecrypt();">
                            <div class="form-group">
                                <label>Decryption Key</label>
                                <input type="password" id="decKey" class="form-control" placeholder="Enter encryption key" autofocus>
                            </div>
                            <button type="submit" class="btn btn-primary" style="width: 100%;">Decrypt & View</button>
                        </form>
                    </div>`;

                const key = document.getElementById('decKey').value;
                if (!key) {
                    this.showAlert('Please enter decryption key', 'error');
                    return;
                }
                this.open(this.current, key);
            },

            async renderCommentPanel(itemName) {
                let comment = '';
                const item = this.items.find(i => i.name === itemName);
                if (item && item.note) {
                    comment = await this.decompressText(item.note);
                } else {
                    comment = this.getComment(itemName) || '';
                }
                document.getElementById('commentPanel').innerHTML = `
                    <div class="comment-panel">
                        <h4>📝 Notes</h4>
                        <textarea id="commentTextarea" class="comment-textarea" placeholder="Add notes about this item...">${utils.escapeHtml(comment)}</textarea>
                        <button class="btn btn-primary btn-sm" style="margin-top: 8px;" onclick="app.saveCommentToKV('${encodeURIComponent(itemName)}')">💾 Save</button>
                    </div>`;
            },

            async saveCommentToKV(encodedName) {
                const name = decodeURIComponent(encodedName);
                const comment = document.getElementById('commentTextarea').value;
                
                try {
                    const compressed = await this.compressText(comment);
                    const url = `${name}?key=${encodeURIComponent(this.key)}&update_meta=1`;
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: compressed
                    });
                    
                    if (!res.ok) throw new Error(await res.text());
                    
                    this.saveComment(name, comment);
                    this.showAlert('Notes saved!', 'success');
                } catch (e) {
                    this.showAlert('Failed to save notes: ' + e.message, 'error');
                }
            },

            async compressText(text) {
                if (!text) return '';
                const stream = new Blob([text]).stream();
                const compressed = stream.pipeThrough(new CompressionStream('gzip'));
                const buf = await new Response(compressed).arrayBuffer();
                return btoa(String.fromCharCode(...new Uint8Array(buf)));
            },

            async decompressText(base64) {
                if (!base64) return '';
                try {
                    const binary = atob(base64);
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) {
                        bytes[i] = binary.charCodeAt(i);
                    }
                    const stream = new Blob([bytes]).stream();
                    const decompressed = stream.pipeThrough(new DecompressionStream('gzip'));
                    return await new Response(decompressed).text();
                } catch (e) {
                    return base64;
                }
            },

            // ================== SAVE ==================
            async save() {
                let content = document.getElementById('editContent')?.value;
                if (content === undefined) {
                    this.showAlert('Nothing to save', 'error');
                    return;
                }

                const type = document.getElementById('typeSelector').value;
                let url = `${this.current.name}?key=${encodeURIComponent(this.key)}`;

                if (this.current.decryptKey) {
                    url += `&c=${encodeURIComponent(this.current.decryptKey)}`;
                }

                if (type.includes('json')) {
                    try {
                        let json = JSON.parse(content);
                        content = JSON.stringify(json, null);
                        document.getElementById('editContent').value = content;
                    } catch (e) {
                        this.showAlert('Invalid JSON: ' + e.message, 'error');
                        return;
                    }
                } else {
                    url += '&s=raw';
                }

                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': type },
                        body: content
                    });

                    if (!res.ok) throw new Error(await res.text());

                    this.showAlert('Saved successfully!', 'success');
                    this.loadItems();
                } catch (e) {
                    this.showAlert('Save failed: ' + e.message, 'error');
                }
            },

            async uploadReplacement() {
                const fileInput = document.getElementById('replaceFile');
                if (!fileInput || !fileInput.files[0]) {
                    this.showAlert('Please select a file', 'error');
                    return;
                }

                const file = fileInput.files[0];
                let url = `${this.current.name}?key=${encodeURIComponent(this.key)}&s=raw`;

                if (this.current.decryptKey) {
                    url += `&c=${encodeURIComponent(this.current.decryptKey)}`;
                }

                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': file.type || 'application/octet-stream' },
                        body: file
                    });

                    if (!res.ok) throw new Error(await res.text());

                    this.showAlert('File replaced!', 'success');
                    this.open(this.current, this.current.decryptKey);
                } catch (e) {
                    this.showAlert('Upload failed: ' + e.message, 'error');
                }
            },

                if (!this.current) return;

                try {
                    const url = `${this.current.name}?key=${encodeURIComponent(this.key)}&set_type=${encodeURIComponent(newType)}`;
                    const res = await fetch(url, { method: 'POST' });

                    if (!res.ok) throw new Error('Update failed');

                    this.showAlert('Type updated to ' + newType, 'success');
                    await this.loadItems();

                    const updated = this.items.find(i => i.name === this.current.name);
                    if (updated) {
                        this.open(updated, this.current.decryptKey);

                } catch (e) {
                    this.showAlert(e.message, 'error');

                if (!this.current) return;
                document.getElementById('renamePath').value = this.current.name;
                document.getElementById('renameFilename').value = this.current.filename || '';
                document.getElementById('renameModal').classList.remove('hidden');
            },

            closeRenameModal() {
                document.getElementById('renameModal').classList.add('hidden');
            },

            async submitRename() {
                const newPath = document.getElementById('renamePath').value.trim();
                const newFilename = document.getElementById('renameFilename').value.trim();

                if (!newPath.startsWith('/')) {
                    this.showAlert('Path must start with /', 'error');
                    return;
                }

                const pathChanged = newPath !== this.current.name;
                const filenameChanged = newFilename !== this.current.filename;

                if (!pathChanged && !filenameChanged) {
                    this.showAlert('No changes made', 'warning');
                    this.closeRenameModal();
                    return;
                }

                try {
                    let url = `${this.current.name}?key=${encodeURIComponent(this.key)}`;
                    if (filenameChanged) url += `&filename=${encodeURIComponent(newFilename)}`;
                    if (pathChanged) url += `&rename_to=${encodeURIComponent(newPath)}`;

                    let res = await fetch(url, { method: 'POST' });

                    if (res.status === 409) {
                        if (confirm('Destination already exists. Overwrite?')) {
                            res = await fetch(url + '&force=true', { method: 'POST' });
                        } else {
                            return;
                        }
                    }

                    if (!res.ok) {
                        throw new Error(await res.text());
                    }

                    this.showAlert('Renamed successfully!', 'success');
                    this.closeRenameModal();
                    await this.loadItems();

                    const finalPath = pathChanged ? newPath : this.current.name;
                    const updated = this.items.find(i => i.name === finalPath);
                    if (updated) {
                        this.open(updated, this.current.decryptKey);
                    }
                } catch (e) {
                    this.showAlert('Rename failed: ' + e.message, 'error');
                }
            },

                if (!this.current) return;
                if (!confirm(`Delete "${this.current.name}"? This cannot be undone.`)) return;

                try {
                    const res = await fetch(`${this.current.name}?key=${encodeURIComponent(this.key)}`, {

                    if (!res.ok) throw new Error(await res.text());

                        </div>`;
                    document.getElementById('editorHeader').classList.add('hidden');
                } catch (e) {
                    this.showAlert('Delete failed: ' + e.message, 'error');
                }
            },
