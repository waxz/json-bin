                            <input type="file" id="newFile" class="form-control" onchange="app.suggestPath(this)" accept="*/*">
                            <small style="color: #666; margin-top: 5px; display: block;">
                                Supports: JSON, Text, Images, Audio (MP3, WAV, OGG), Video, and more
                            </small>
                        </div>

                        <div class="form-group">
                            <label>Filename (for downloads)</label>
                            <input type="text" id="newFilename" class="form-control" placeholder="Optional display name">
                        </div>

                        <div class="form-group">
                            <label>Encryption Key (optional)</label>
                            <input type="password" id="newKey" class="form-control" placeholder="Leave empty for no encryption">
                        </div>

                        <button type="submit" class="btn btn-success" style="width: 100%;">Create Item</button>
                    </form>`;
            },

            toggleNewMode() {
                const mode = document.querySelector('input[name="newMode"]:checked').value;
                document.getElementById('grpJson').classList.toggle('hidden', mode !== 'json');
                document.getElementById('grpText').classList.toggle('hidden', mode !== 'text');
                document.getElementById('grpMarkdown').classList.toggle('hidden', mode !== 'markdown');
                document.getElementById('grpFile').classList.toggle('hidden', mode !== 'file');
                if (mode === 'json') this.validateJson();
            },

            validateJson() {
                const textarea = document.getElementById('newJsonContent');
                const status = document.getElementById('newJsonStatus');
                const value = textarea.value.trim();
                
                if (!value) {
                    status.innerHTML = '';
                    return true;
                }
                
                try {
                    const parsed = JSON.parse(value);
                    const formatted = JSON.stringify(parsed, null, 2);
                    if (value !== formatted) {
                        textarea.value = formatted;
                    }
                    status.innerHTML = '<span style="color: #22c55e;">✓ Valid JSON</span>';
                    return true;
                } catch (e) {
                    status.innerHTML = `<span style="color: #ef4444;">✕ Invalid JSON: ${e.message}</span>`;
                    return false;
                }
            },

            toggleNewJsonTab(tab) {
                const edit = document.getElementById('newJsonContent');
                const preview = document.getElementById('newJsonPreview');
                const status = document.getElementById('newJsonStatus');
                const tabs = document.querySelectorAll('#grpJson .tab');

                if (tab === 'edit') {
                    edit.classList.remove('hidden');
                    preview.classList.add('hidden');
                    tabs[0].classList.add('active');
                    tabs[1].classList.remove('active');
                } else {
                    if (this.validateJson()) {
                        try {
                            const parsed = JSON.parse(edit.value);
                            preview.innerHTML = this.syntaxHighlightJson(parsed);
                        } catch (e) {
                            preview.innerHTML = '<span style="color: #ef4444;">Invalid JSON</span>';
                        }
                    }
                    edit.classList.add('hidden');
                    preview.classList.remove('hidden');
                    tabs[0].classList.remove('active');
                    tabs[1].classList.add('active');
                }
            },

            syntaxHighlightJson(obj) {
                const json = JSON.stringify(obj, null, 2);
                return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, (match) => {
                    let cls = 'number';
                    if (/^"/.test(match)) {
                        cls = /:$/.test(match) ? 'key' : 'string';
                    } else if (/true|false/.test(match)) {
                        cls = 'boolean';
                    } else if (/null/.test(match)) {
                        cls = 'null';
                    }
                    return `<span style="color: ${cls === 'key' ? '#881391' : cls === 'string' ? '#0d7a0d' : cls === 'number' ? '#0550ae' : cls === 'boolean' ? '#0550ae' : '#d12f1b'};">${match}</span>`;
                }).replace(/[{}\[\]]/g, (m) => `<span style="color: #d12f1b;">${m}</span>`);
            },

            toggleNewMdTab(tab) {
                const edit = document.getElementById('newMdContent');
                const preview = document.getElementById('newMdPreview');
                const tabs = document.querySelectorAll('#grpMarkdown .tab');

                if (tab === 'edit') {
                    edit.classList.remove('hidden');
                    preview.classList.add('hidden');
                    tabs[0].classList.add('active');
                    tabs[1].classList.remove('active');
                } else {
                    preview.innerHTML = utils.renderMarkdown(edit.value);
                    this.addCopyButtonsToCodeBlocks();
                    edit.classList.add('hidden');
                    preview.classList.remove('hidden');
                    tabs[0].classList.remove('active');
                    tabs[1].classList.add('active');
                }
            },

            suggestPath(input) {
                const pathInput = document.getElementById('newPath');
                const filenameInput = document.getElementById('newFilename');
                if (input.files[0]) {
                    if (!pathInput.value) pathInput.value = '/' + input.files[0].name;
                    if (!filenameInput.value) filenameInput.value = input.files[0].name;
                }
            },

            async create() {
                const path = document.getElementById('newPath').value.trim();
                if (!path.startsWith('/')) {
                    this.showAlert('Path must start with /', 'error');
                    return;
                }

                const key = document.getElementById('newKey').value;
                const filename = document.getElementById('newFilename').value.trim();
                const mode = document.querySelector('input[name="newMode"]:checked').value;

                let url = `${path}?key=${encodeURIComponent(this.key)}`;
                if (filename) url += `&filename=${encodeURIComponent(filename)}`;
                if (key) url += `&c=${encodeURIComponent(key)}`;

                let body, contentType;

                if (mode === 'file') {
                    const fileInput = document.getElementById('newFile');
                    if (!fileInput || !fileInput.files[0]) {
                        this.showAlert('Please select a file', 'error');
                        return;
                    }
                    body = fileInput.files[0];
                    contentType = body.type || 'application/octet-stream';
                    url += '&s=raw';
                } else if (mode === 'json') {
                    if (!this.validateJson()) {
                        this.showAlert('Please enter valid JSON', 'error');
                        return;
                    }
                    body = document.getElementById('newJsonContent').value;
                    contentType = 'application/json';
                } else if (mode === 'markdown') {
                    body = document.getElementById('newMdContent').value;
                    contentType = 'text/markdown';
                    url += '&s=raw';
                } else {
                    body = document.getElementById('newContent').value;
                    contentType = 'text/plain';
                    url += '&s=raw';
                }

                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': contentType },
                        body
                    });

                    if (!res.ok) throw new Error(await res.text());

                    this.showAlert('Created successfully!', 'success');
                    await this.loadItems();

                    const newItem = this.items.find(i => i.name === path);
                    if (newItem) {
                        this.open(newItem, key || null);
                    }
                } catch (e) {
                    this.showAlert('Create failed: ' + e.message, 'error');
                }
            },

            // ================== SHARE ==================
            showShareModal() {
                if (!this.current) return;

                const hasExisting = this.current.shareLink && this.current.shareLink !== '-' && this.current.shareLink !== '';
                const existingInfoEl = document.getElementById('existingShareInfo');

                if (hasExisting) {
                    existingInfoEl.classList.remove('hidden');
                    const fullUrl = window.location.origin + this.current.shareLink;
                    document.getElementById('existingShareUrl').value = fullUrl;
                    document.getElementById('existingShareCode').value = this.current.code || '(none)';
                } else {
                    existingInfoEl.classList.add('hidden');
                }

                document.getElementById('shareModal').classList.remove('hidden');
                document.getElementById('shareResultGroup').classList.add('hidden');
                document.getElementById('btnGenShare').style.display = 'inline-flex';
                document.getElementById('shareExpiry').value = '1';
                document.getElementById('sharedCode').value = this.current.code || '';
            },

            closeShareModal() {
                document.getElementById('shareModal').classList.add('hidden');
            },

            closeModalOnBackdrop(event) {
                if (event.target.classList.contains('modal-overlay')) {
                    event.target.classList.add('hidden');
                }
            },

            async generateShareLink() {
                const expiry = document.getElementById('shareExpiry').value;
                const code = document.getElementById('sharedCode').value;

                let url = `${this.current.name}?key=${encodeURIComponent(this.key)}&download=1&expires=${expiry}&code=${encodeURIComponent(code)}&json_response=1`;

                if (this.current.decryptKey) {
                    url += `&c=${encodeURIComponent(this.current.decryptKey)}`;
                }

                try {
                    const res = await fetch(url);
                    if (!res.ok) throw new Error(await res.text());

                    const data = await res.json();
                    const shareUrl = window.location.origin + data.url;

                    document.getElementById('shareUrl').value = shareUrl;
                    document.getElementById('shareResultGroup').classList.remove('hidden');
                    document.getElementById('btnGenShare').style.display = 'none';

                    // Update the current item's share info and refresh
                    this.current.shareLink = data.url;
                    this.current.code = code;

                    // Refresh the list to pick up new metadata
                    await this.loadItems();

                    // Re-find the current item with updated data
                    const updated = this.items.find(i => i.name === this.current.name);
                    if (updated) {
                        this.current = { ...updated, decryptKey: this.current.decryptKey };
                        this.renderShareInfoBar(updated);
                    }
                } catch (e) {
                    this.showAlert('Error generating link: ' + e.message, 'error');
                }
            },

            copyShareUrl() {
                const input = document.getElementById('shareUrl');
                this.copyText(input.value);
            },

            copyExistingShareUrl() {
                const input = document.getElementById('existingShareUrl');
                this.copyText(input.value);
            },

            // ================== ALERTS ==================
            showAlert(msg, type) {
                const icons = { success: '✓', error: '✕', warning: '⚠' };
                const el = document.getElementById('alertArea');
                el.innerHTML = `<div class="alert alert-${type}">${icons[type] || ''} ${utils.escapeHtml(msg)}</div>`;
                setTimeout(() => el.innerHTML = '', 4000);
            }
        };


        // ================== KEYBOARD SHORTCUTS ==================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay:not(.hidden)').forEach(m => m.classList.add('hidden'));
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                if (app.current && document.getElementById('editContent')) {
                    e.preventDefault();
                    app.save();
                }
            }
            if (e.key === ' ' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
                const audio = document.getElementById('audioElement');
                const video = document.getElementById('videoElement');
                const media = audio || video;
                if (media) {
                    e.preventDefault();
                    if (media.paused) media.play();
                    else media.pause();
                }
            }
        });

        // ================== EVENT DELEGATION ==================
        document.getElementById('itemsList').addEventListener('click', (e) => {
            const itemEl = e.target.closest('.item, .tree-item');
            if (itemEl && itemEl.dataset.name && !e.target.classList.contains('star-btn') && !e.target.classList.contains('tree-toggle')) {
                app.openByName(itemEl.dataset.name);
            }
        });

        document.getElementById('itemsList').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const itemEl = e.target.closest('.item, .tree-item');
                if (itemEl && itemEl.dataset.name) {
                    app.openByName(itemEl.dataset.name);
                }
            }
        });

        // ================== INIT ==================
        if (localStorage.getItem('jsonbin_key')) {
            document.getElementById('apiKeyInput').value = localStorage.getItem('jsonbin_key');
            app.login();
        }
    </script>
</body>
</html>
